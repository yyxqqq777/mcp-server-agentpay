# Smithery metadata for AgentPay (stdio MCP via uvx / GitHub)
name: agentpay
displayName: AgentPay
description: >
  Pay-per-call Xiaohongshu (小红书) note & China wholesale pricing for AI agents.
  Settles USDC on Base via x402. Users only configure AGENT_PRIVATE_KEY.
homepage: https://github.com/yyxqqq777/mcp-server-agentpay
icon: ./icon.svg
keywords:
  - mcp
  - x402
  - xiaohongshu
  - 小红书
  - usdc
  - base
  - micropayments
  - agents
  - china
  - wholesale
categories:
  - payments
  - data
  - social
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [AGENT_PRIVATE_KEY]
    properties:
      AGENT_PRIVATE_KEY:
        type: string
        title: Agent wallet private key
        description: EVM private key that holds USDC for micropayments (Base Sepolia or Mainnet)
        secret: true
      MAX_SPEND_PER_CALL:
        type: string
        title: Max USDC per call
        default: "0.10"
      PAYMENT_MODE:
        type: string
        title: Payment mode
        default: production
        enum: [demo, production]
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['mcp-server-agentpay'],
      env: {
        GATEWAY_BASE_URL: 'https://agentpay-xhs-production.up.railway.app',
        AGENT_PRIVATE_KEY: config.AGENT_PRIVATE_KEY || '',
        MAX_SPEND_PER_CALL: config.MAX_SPEND_PER_CALL || '0.10',
        PAYMENT_MODE: config.PAYMENT_MODE || 'production',
        PYTHONUNBUFFERED: '1'
      }
    })
